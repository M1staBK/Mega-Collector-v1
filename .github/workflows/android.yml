name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Back-to-back pushes to main run one after another, so they don't pick the same release number.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags are needed to number auto releases

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The repo has no gradlew script, so install the version from gradle-wrapper.properties.
      - name: Read Gradle version
        id: gradle
        run: echo "version=$(sed -n 's/.*gradle-\(.*\)-bin.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      # debug.keystore is gitignored, but the debug build signs with it.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug

      # Only when the KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD secrets are set.
      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          gradle assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/mega-collector-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/mega-collector.apk
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: out/*.apk

      # A pushed v* tag is released as is. A push to main gets the next patch
      # number after the newest v* tag (v1.0 -> v1.0.1, v1.0.1 -> v1.0.2).
      - name: Pick release tag
        id: tag
        if: github.event_name == 'push'
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          base=${latest:-v1.0}
          if [[ "$base" =~ ^(v[0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            next="${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1))"
          else
            next="$base.1"
          fi
          echo "name=$next" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: steps.tag.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: gh release create "$TAG" out/*.apk --target "$GITHUB_SHA" --title "$TAG" --generate-notes
